services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundationos}
      POSTGRES_USER: ${POSTGRES_USER:-gmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmh} -d ${POSTGRES_DB:-foundationos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-gmh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundationos}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?Set ALLOWED_ORIGIN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    networks: [internal]
volumes:
  postgres_data:
networks:
  internal:
    driver: bridge
