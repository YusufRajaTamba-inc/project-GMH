version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gmh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foundationos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: [ PASSWORD ]
    ports:
      - "5432:5432"
    volumes:
      - gmh_postgres_data:/var/lib/postgresql/data

volumes:
  gmh_postgres_data:
