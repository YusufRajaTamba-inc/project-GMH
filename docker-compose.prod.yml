services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundationos}
      POSTGRES_USER: ${POSTGRES_USER:-gmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmh} -d ${POSTGRES_DB:-foundationos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-gmh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundationos}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?Set ALLOWED_ORIGIN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks: [internal]

  # Jalankan sekali: membuat skema tabel dari schema.sql
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-gmh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundationos}
    command: ["node", "apps/api/dist/database/init.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Jalankan sekali: seeding data awal roles, master lookups, dan akun superadmin
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["seed"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-gmh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundationos}
    command: ["node", "apps/api/dist/database/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
